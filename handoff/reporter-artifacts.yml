# .github/workflows/reporter-artifacts.yml
#
# Runs every open "reporter-artifact" issue's replay tarball against the
# release candidate. Release fails if any tarball is red.
#
# This is the load-bearing step in the closed-loop bug workflow: it makes
# it physically impossible to ship a "resolved" release while a reporter's
# actual failing artifact is still failing.
#
# Filed by: clean-errors (see tools/cln-repro/README.md in clean-errors repo)
# Contact: errors.cleanlanguage.dev/prompts/detail?id=<canary-prompt>
#
# Trigger design:
#   - On every push to a v* tag (release candidate build): required to pass.
#   - On workflow_dispatch: manual re-run against latest tag.
#   - On issue label change to "reporter-artifact": re-check that one issue.

name: reporter-artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Compiler version to test (defaults to latest release)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write   # so we can comment pass/fail back on each issue

jobs:
  replay-reporter-artifacts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cln_repro
          MYSQL_DATABASE: cln_repro_replay
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pcln_repro"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install node + clean-node-server
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs mysql-client
          sudo npm install -g @ivan-pasco/clean-node-server@latest
          clean-node-server --version || true

      - name: install this compiler build
        run: |
          # Assumes the workflow that produces the release also uploads the
          # compiled `cln` binary. This step wires the just-built binary
          # into PATH before running the replays.
          ls target/release/cln* 2>/dev/null || cargo build --release --bin cln
          sudo cp target/release/cln /usr/local/bin/cln
          cln --version

      - name: install cln-repro tool
        run: |
          # Fetched from a public release asset on the clean-errors repo so
          # this works even if clean-errors itself is private (release
          # assets are always anonymously downloadable).
          curl -fsSL https://github.com/Ivan-Pasco/clean-errors/releases/download/repro-tarballs/cln-repro.tar.gz \
            -o /tmp/cln-repro.tar.gz
          sudo tar xzf /tmp/cln-repro.tar.gz -C /usr/local/lib/
          # After extraction:
          #   /usr/local/lib/cln-repro/cln-repro         (dispatcher)
          #   /usr/local/lib/cln-repro/lib/*.sh          (capture, run, capture-compile)
          #   /usr/local/lib/cln-repro/spec/*            (manifest schema)
          sudo ln -sf /usr/local/lib/cln-repro/cln-repro /usr/local/bin/cln-repro
          sudo chmod +x /usr/local/lib/cln-repro/cln-repro /usr/local/lib/cln-repro/lib/*.sh
          cln-repro 2>&1 | head -3 || true

      - name: fetch open reporter-artifact issues
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List all open issues labeled reporter-artifact on this repo.
          # gh outputs one URL per line.
          gh issue list \
            --state open \
            --label reporter-artifact \
            --limit 100 \
            --json url \
            -q '.[].url' > /tmp/issue_urls.txt
          echo "found_count=$(wc -l < /tmp/issue_urls.txt)" >> "$GITHUB_OUTPUT"

      - name: replay each tarball
        env:
          CLN_REPRO_DB_URL: mysql://root:cln_repro@127.0.0.1:3306/cln_repro_replay
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILURES=0
          TOTAL=0
          RESULTS_FILE=/tmp/replay_results.md
          echo "# Replay results — cln $(cln --version | awk '{print $NF}')" > "$RESULTS_FILE"
          echo "" >> "$RESULTS_FILE"
          echo "| Issue | Fingerprint | Result |" >> "$RESULTS_FILE"
          echo "|-------|-------------|--------|" >> "$RESULTS_FILE"

          while IFS= read -r ISSUE_URL; do
            [[ -z "$ISSUE_URL" ]] && continue
            TOTAL=$((TOTAL+1))
            echo ""
            echo "═══ REPLAY: $ISSUE_URL ═══"
            set +e
            cln-repro run "$ISSUE_URL" > "/tmp/replay-$TOTAL.log" 2>&1
            RC=$?
            set -e
            FP=$(grep -oE 'fingerprint=[a-f0-9]+' "/tmp/replay-$TOTAL.log" | head -1 | cut -d= -f2)
            if [[ $RC -eq 0 ]]; then
              echo "| $ISSUE_URL | ${FP:0:12} | PASS |" >> "$RESULTS_FILE"
              echo "PASS: $ISSUE_URL"
              # Comment on the issue: this release passed
              gh issue comment "$ISSUE_URL" --body "✅ **Passed** on cln $(cln --version | awk '{print $NF}') — this fix appears to resolve the reported artifact. Auto-closing in 24h if no objection." || true
            else
              FAILURES=$((FAILURES+1))
              echo "| $ISSUE_URL | ${FP:0:12} | FAIL |" >> "$RESULTS_FILE"
              echo "FAIL: $ISSUE_URL (exit=$RC)"
              tail -30 "/tmp/replay-$TOTAL.log"
              gh issue comment "$ISSUE_URL" --body "❌ **Still failing** on cln $(cln --version | awk '{print $NF}'). Replay log excerpt:
              \`\`\`
              $(tail -30 /tmp/replay-$TOTAL.log)
              \`\`\`" || true
            fi
          done < /tmp/issue_urls.txt

          echo "" >> "$RESULTS_FILE"
          echo "**Total: $TOTAL, Failures: $FAILURES**" >> "$RESULTS_FILE"
          cat "$RESULTS_FILE"

          if [[ $FAILURES -gt 0 ]]; then
            echo ""
            echo "Release blocked: $FAILURES reporter artifact(s) still fail."
            exit 1
          fi

      - name: summary
        if: always()
        run: |
          if [[ -f /tmp/replay_results.md ]]; then
            cat /tmp/replay_results.md >> "$GITHUB_STEP_SUMMARY"
          fi
